<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GestiPro — Gestion stock &amp; ventes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Menu latéral">
    <div class="brand">
      <span class="brand-ic"><svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg></span>
      <span class="brand-t">GestiPro</span>
    </div>
    <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
    <div class="side-foot">
      <button class="site-card" type="button" data-a="pickSite" id="site-card"></button>
      <button class="side-btn" type="button" data-a="lock">
        <svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        Verrouiller la session
      </button>
    </div>
  </aside>
  <div class="scrim" data-a="closeNav"></div>

  <div class="main">
    <header class="top">
      <div class="top-l">
        <button class="ibtn menu-btn" type="button" data-a="openNav" aria-label="Ouvrir le menu"><svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <span class="dot" id="top-dot"></span>
        <span class="ctx" id="top-ctx"></span>
      </div>
      <div class="top-r">
        <span class="clock num" id="clock"></span>
        <button class="ibtn" type="button" data-a="notifs" id="bell" aria-label="Notifications"></button>
        <button class="ibtn" type="button" data-a="help" aria-label="Aide et raccourcis"><svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.5V14M12 17.5v.01"/></svg></button>
        <button class="me-btn" type="button" data-a="userMenu" id="me-btn" aria-label="Menu utilisateur"></button>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<div class="lock" id="lock" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="print-area"></div>

<script src="app.js"></script>
</body>
</html>
